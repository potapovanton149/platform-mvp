---
# ============================================================
# Общие переменные для всех playbook
# ============================================================
timezone: UTC
ansible_user: devops
ansible_ssh_private_key_file: ~/.ssh/id_ed25519

# ============================================================
# Сеть / VIP
# ============================================================
kube_vip: 192.168.75.100
kube_vip_interface: ens33
k8s_pod_cidr: 10.244.0.0/16
k8s_service_cidr: 10.96.0.0/12

# ============================================================
# Версии компонентов
# ============================================================
kube_version: v1.30.4
kubespray_version: v2.26.0
cilium_version: "v1.16.1"      # справочно (ставит Kubespray)
longhorn_version: "1.7.1"     # справочно (ставит ArgoCD)
argocd_chart_version: "7.6.12"
argocd_namespace: argocd
helm_version: "v3.16.1"

# ============================================================
# GitOps repo
# ============================================================
repo_url: "https://github.com/potapov149/platform-mvp"
repo_branch: main

# ============================================================
# Метки нод (пост-kubespray)
# ============================================================
node_labels:
  worker-1:
    - "monitoring=true"
    - "logging=true"
  worker-2:
    - "storage=true"
  worker-3:
    - "ingress=true"