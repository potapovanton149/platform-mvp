---
# Kubespray ожидает ровно ту же схему групп, что и prod.yml.
# Оставляем как отдельный файл (не symlink), чтобы можно было
# независимо эволюционировать (например, добавить kubespray-специфичные
# per-host vars). Содержимое идентично prod.yml.
all:
  children:
    k8s_cluster:
      children:
        kube_control_plane:
          hosts:
            cp-1:
              ansible_host: 192.168.190.101
              ansible_user: devops
              ansible_ssh_private_key_file: ~/.ssh/id_ed25519
              ansible_python_interpreter: /usr/bin/python3
            cp-2:
              ansible_host: 192.168.190.151
              ansible_user: devops
              ansible_ssh_private_key_file: ~/.ssh/id_ed25519
              ansible_python_interpreter: /usr/bin/python3
            cp-3:
              ansible_host: 192.168.190.150
              ansible_user: devops
              ansible_ssh_private_key_file: ~/.ssh/id_ed25519
              ansible_python_interpreter: /usr/bin/python3
        kube_node:
          hosts:
            worker-1:
              ansible_host: 192.168.190.153
              ansible_user: devops
              ansible_ssh_private_key_file: ~/.ssh/id_ed25519
              ansible_python_interpreter: /usr/bin/python3
            worker-2:
              ansible_host: 192.168.190.146
              ansible_user: devops
              ansible_ssh_private_key_file: ~/.ssh/id_ed25519
              ansible_python_interpreter: /usr/bin/python3
            worker-3:
              ansible_host: 192.168.190.145
              ansible_user: devops
              ansible_ssh_private_key_file: ~/.ssh/id_ed25519
              ansible_python_interpreter: /usr/bin/python3
        etcd:
          hosts:
            cp-1:
            cp-2:
            cp-3:`