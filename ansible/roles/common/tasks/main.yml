---
- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Disable swap at runtime
  ansible.builtin.command: swapoff -a
  when: common_swap_disabled | bool
  changed_when: false

- name: Comment swap entries in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'
  when: common_swap_disabled | bool

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ common_kernel_modules }}"

- name: Persist kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      {% for m in common_kernel_modules %}
      {{ m }}
      {% endfor %}
    mode: "0644"

- name: Apply sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      {% for k, v in common_sysctl.items() %}
      {{ k }} = {{ v }}
      {% endfor %}
    mode: "0644"
  notify: Reload sysctl

- name: Stop unattended-upgrades service
  ansible.builtin.systemd:
    name: unattended-upgrades
    state: stopped
    enabled: false
  failed_when: false

- name: Disable unattended-upgrades via apt.conf.d
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Unattended-Upgrade "0";
    mode: "0644"
  failed_when: false

- name: Wait for any dpkg/apt lock to be released
  ansible.builtin.shell: |
    set -e
    for i in $(seq 1 60); do
      if ! fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock >/dev/null 2>&1; then
        exit 0
      fi
      sleep 2
    done
    echo "dpkg lock still held after 120s" >&2
    exit 1
  args:
    executable: /bin/bash
  changed_when: false

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Ensure chrony enabled and running
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

- name: Disable ufw
  ansible.builtin.systemd:
    name: ufw
    enabled: false
    state: stopped
  failed_when: false

- name: Ensure open-vm-tools running
  ansible.builtin.systemd:
    name: open-vm-tools
    enabled: true
    state: started