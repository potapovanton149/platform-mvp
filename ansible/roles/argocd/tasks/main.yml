---
- name: Check if helm is installed
  ansible.builtin.command: helm version --short
  register: helm_check
  failed_when: false
  changed_when: false

- name: Install Helm
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  when: helm_check.rc != 0
  args:
    executable: /bin/bash

- name: Add Argo Helm repo
  kubernetes.core.helm_repository:
    name: "{{ argocd_helm_repo_name }}"
    repo_url: "{{ argocd_helm_repo_url }}"

- name: Ensure argocd namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ lookup('env','HOME') }}/.kube/config"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ argocd_namespace }}"

- name: Install/upgrade ArgoCD via Helm
  kubernetes.core.helm:
    kubeconfig: "{{ lookup('env','HOME') }}/.kube/config"
    name: "{{ argocd_release_name }}"
    chart_ref: "{{ argocd_helm_repo_name }}/argo-cd"
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: false
    values_files:
      - "{{ argocd_values_file }}"
    wait: true
    wait_timeout: 10m
    atomic: true

- name: Wait for ArgoCD server deployment
  kubernetes.core.k8s_info:
    kubeconfig: "{{ lookup('env','HOME') }}/.kube/config"
    kind: Deployment
    namespace: "{{ argocd_namespace }}"
    name: "{{ argocd_release_name }}-argocd-server"
  register: argocd_server
  until:
    - argocd_server.resources | length > 0
    - argocd_server.resources[0].status.readyReplicas | default(0) == 1
  retries: 30
  delay: 10

- name: Apply root App-of-Apps
  kubernetes.core.k8s:
    kubeconfig: "{{ lookup('env','HOME') }}/.kube/config"
    state: present
    src: "{{ argocd_root_app }}"

- name: Wait for initial admin secret
  kubernetes.core.k8s_info:
    kubeconfig: "{{ lookup('env','HOME') }}/.kube/config"
    kind: Secret
    namespace: "{{ argocd_namespace }}"
    name: argocd-initial-admin-secret
  register: argocd_secret
  until:
    - argocd_secret.resources is defined
    - argocd_secret.resources | length > 0
    - argocd_secret.resources[0].data is defined
    - argocd_secret.resources[0].data.password is defined
  retries: 30
  delay: 5

- name: Decode admin password
  ansible.builtin.set_fact:
    argocd_admin_password: "{{ argocd_secret.resources[0].data.password | b64decode }}"

- name: Print ArgoCD access info
  ansible.builtin.debug:
    msg:
      - "ArgoCD access: kubectl -n argocd port-forward svc/argo-cd-argocd-server 8080:443"
      - "ArgoCD URL:    https://localhost:8080"
      - "ArgoCD user:   admin"
      - "ArgoCD pass:   {{ argocd_admin_password }}"
- name: Print ArgoCD access info
  ansible.builtin.debug:
    msg:
      - "ArgoCD URL:      https://argocd.local (after ingress) / currently: kubectl port-forward -n argocd svc/argo-cd-server 8080:80"
      - "ArgoCD user:     admin"
      - "ArgoCD password: {{ argocd_admin_password }}"