config:
  clients:
    - url: http://loki.logging.svc.cluster.local:3100/loki/api/v1/push
  snippets:
    extraRelabelConfigs:
      - action: replace
        source_labels:
          - __meta_kubernetes_pod_node_name
        target_label: node

daemonset:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

tolerations:
  - effect: NoSchedule
    operator: Exists

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

# Promtail должен читать /var/log/pods со всех нод
volumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers

volumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true