apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.21.0
      helm:
        valueFiles:
          - $values/k8s/values/loki.yaml
    - repoURL: https://github.com/potapovanton149/platform-mvp
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: loki
      jqPathExpressions:
        - .spec.persistentVolumeClaimRetentionPolicy
        - .spec.volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m