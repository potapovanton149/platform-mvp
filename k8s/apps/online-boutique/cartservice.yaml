apiVersion: v1
kind: Service
metadata:
  name: cartservice
  labels: {app: cartservice}
spec:
  selector: {app: cartservice}
  ports: [{name: grpc, port: 7070, targetPort: 7070}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
spec:
  replicas: 1
  selector: {matchLabels: {app: cartservice}}
  template:
    metadata:
      labels: {app: cartservice}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7070"
    spec:
      imagePullSecrets: [{name: harbor-creds}]
      containers:
        - name: cartservice
          image: harbor.platform-mvp-potapov.ru/online-boutique/cartservice:v1.0.0
          ports: [{name: grpc, containerPort: 7070}]
          env:
            - {name: REDIS_ADDR, value: "redis-cart:6379"}
            - {name: PORT, value: "7070"}
            - {name: OTEL_SERVICE_NAME, value: "cartservice"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.tracing.svc:4317"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 512Mi}