apiVersion: v1
kind: Service
metadata:
  name: checkoutservice
  labels: {app: checkoutservice}
spec:
  selector: {app: checkoutservice}
  ports: [{name: grpc, port: 5050, targetPort: 5050}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
spec:
  replicas: 1
  selector: {matchLabels: {app: checkoutservice}}
  template:
    metadata:
      labels: {app: checkoutservice}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5050"
    spec:
      imagePullSecrets: [{name: harbor-creds}]
      containers:
        - name: checkoutservice
          image: harbor.platform-mvp-potapov.ru/online-boutique/checkoutservice:v1.0.0
        imagePullPolicy: Always
          ports: [{name: grpc, containerPort: 5050}]
          env:
            - {name: PORT, value: "5050"}
            - {name: PRODUCT_CATALOG_SERVICE_ADDR, value: "productcatalogservice:3550"}
            - {name: SHIPPING_SERVICE_ADDR, value: "shippingservice:50051"}
            - {name: PAYMENT_SERVICE_ADDR, value: "paymentservice:50051"}
            - {name: EMAIL_SERVICE_ADDR, value: "emailservice:5000"}
            - {name: CURRENCY_SERVICE_ADDR, value: "currencyservice:7000"}
            - {name: CART_SERVICE_ADDR, value: "cartservice:7070"}
            - {name: DISABLE_PROFILER, value: "1"}
            - {name: OTEL_SERVICE_NAME, value: "checkoutservice"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.tracing.svc:4317"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 512Mi}