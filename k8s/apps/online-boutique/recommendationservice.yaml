apiVersion: v1
kind: Service
metadata:
  name: recommendationservice
  labels: {app: recommendationservice}
spec:
  selector: {app: recommendationservice}
  ports: [{name: grpc, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
spec:
  replicas: 1
  selector: {matchLabels: {app: recommendationservice}}
  template:
    metadata:
      labels: {app: recommendationservice}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      imagePullSecrets: [{name: harbor-creds}]
      containers:
        - name: recommendationservice
          image: harbor.platform-mvp-potapov.ru/online-boutique/recommendationservice:v1.0.0
          ports: [{name: grpc, containerPort: 8080}]
          env:
            - {name: PORT, value: "8080"}
            - {name: PRODUCT_CATALOG_SERVICE_ADDR, value: "productcatalogservice:3550"}
            - {name: DISABLE_PROFILER, value: "1"}
            - {name: OTEL_SERVICE_NAME, value: "recommendationservice"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.tracing.svc:4317"}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {cpu: 500m, memory: 512Mi}