apiVersion: v1
kind: Service
metadata:
  name: emailservice
  labels: {app: emailservice}
spec:
  selector: {app: emailservice}
  ports: [{name: grpc, port: 5000, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
spec:
  replicas: 1
  selector: {matchLabels: {app: emailservice}}
  template:
    metadata:
      labels: {app: emailservice}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      imagePullSecrets: [{name: harbor-creds}]
      containers:
        - name: emailservice
          image: harbor.platform-mvp-potapov.ru/online-boutique/emailservice:v1.0.0
          ports: [{name: grpc, containerPort: 8080}]
          env:
            - {name: PORT, value: "8080"}
            - {name: DISABLE_PROFILER, value: "1"}
            - {name: OTEL_SERVICE_NAME, value: "emailservice"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.tracing.svc:4317"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 256Mi}