apiVersion: v1
kind: Service
metadata:
  name: paymentservice
  labels: {app: paymentservice}
spec:
  selector: {app: paymentservice}
  ports: [{name: grpc, port: 50051, targetPort: 50051}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
spec:
  replicas: 1
  selector: {matchLabels: {app: paymentservice}}
  template:
    metadata:
      labels: {app: paymentservice}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      imagePullSecrets: [{name: harbor-creds}]
      containers:
        - name: paymentservice
          image: harbor.platform-mvp-potapov.ru/online-boutique/paymentservice:v1.0.0
          ports: [{name: grpc, containerPort: 50051}]
          env:
            - {name: PORT, value: "50051"}
            - {name: DISABLE_PROFILER, value: "1"}
            - {name: OTEL_SERVICE_NAME, value: "paymentservice"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.tracing.svc:4317"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 256Mi}