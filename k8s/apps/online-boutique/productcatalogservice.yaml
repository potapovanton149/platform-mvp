apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  labels: {app: productcatalogservice}
spec:
  selector: {app: productcatalogservice}
  ports: [{name: grpc, port: 3550, targetPort: 3550}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
spec:
  replicas: 1
  selector: {matchLabels: {app: productcatalogservice}}
  template:
    metadata:
      labels: {app: productcatalogservice}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3550"
    spec:
      imagePullSecrets: [{name: harbor-creds}]
      containers:
        - name: productcatalogservice
          image: harbor.platform-mvp-potapov.ru/online-boutique/productcatalogservice:v1.0.0
          ports: [{name: grpc, containerPort: 3550}]
          env:
            - {name: PORT, value: "3550"}
            - {name: DISABLE_PROFILER, value: "1"}
            - {name: OTEL_SERVICE_NAME, value: "productcatalogservice"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.tracing.svc:4317"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 512Mi}