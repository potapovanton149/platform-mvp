apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: 1.15.1
      helm:
        valueFiles:
          - $values/k8s/values/harbor.yaml
    - repoURL: https://github.com/potapovanton149/platform-mvp.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: harbor-core
      jsonPointers:
        - /spec/strategy
    - group: apps
      kind: Deployment
      name: harbor-jobservice
      jsonPointers:
        - /spec/strategy
    - group: apps
      kind: Deployment
      name: harbor-registry
      jsonPointers:
        - /spec/strategy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
