apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/potapovanton149/platform-mvp.git
      targetRevision: 9ad685e6928aaed43896948a72fb6ee4a9c65e9c
      path: k8s/charts/longhorn
      helm:
        valueFiles:
          - $values/k8s/values/longhorn.yaml
    - repoURL: https://github.com/potapovanton149/platform-mvp.git
      targetRevision: 9ad685e6928aaed43896948a72fb6ee4a9c65e9c
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
