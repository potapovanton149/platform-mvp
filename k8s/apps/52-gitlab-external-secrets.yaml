apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/potapovanton149/platform-mvp
    targetRevision: master
    path: k8s/manifests/external-secrets
    directory:
      recurse: false
      include: '{gitlab-root.yaml,harbor-credentials.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true