apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-credentials
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-credentials
  data:
    - secretKey: HARBOR_USER
      remoteRef:
        key: kv/platform/harbor
        property: admin-user
    - secretKey: HARBOR_PASSWORD
      remoteRef:
        key: kv/platform/harbor
        property: admin-password