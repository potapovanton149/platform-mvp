apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-tls
  namespace: gitlab
spec:
  secretName: gitlab-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - gitlab.platform-mvp-potapov.ru
    - registry.gitlab.platform-mvp-potapov.ru
    - minio.gitlab.platform-mvp-potapov.ru